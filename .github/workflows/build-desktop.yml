name: Compilar y Generar Instalador Windows .EXE

on:
  push:
    branches: [ main, master, feature/offline-first-pos ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versión o etiqueta del Release (ej. v1.0.0)'
        required: false
        default: ''
      create_release:
        description: '¿Publicar automáticamente en GitHub Releases?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Compilar Instalador y Ejecutable Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependencias del proyecto
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund

      - name: 🛠️ Preparar Electron y electron-builder
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund electron@33.2.1 electron-builder@25.1.8

      - name: 🔎 Verificar toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          npx electron --version
          npx electron-builder --version

      - name: 🧪 Verificación TypeScript
        run: npm run lint

      - name: 🚀 Compilar aplicación web (Vite + React)
        run: npm run build

      - name: 📦 Generar Setup NSIS + Portable x64
        run: npx electron-builder --win --x64 --config electron-builder.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 📤 Publicar artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: Distribuidora-LaGranBodega-Windows-${{ github.sha }}
          path: |
            release-builds/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: 🏷️ Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true && inputs.version_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          name: "Distribuidora La Gran Bodega M&S - Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          body: |
            ### 📦 Descargas para Windows
            - Instalador Setup NSIS (.exe)
            - Ejecutable Portable (.exe)
            
            Compilado automáticamente mediante GitHub Actions.
          files: |
            release-builds/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
