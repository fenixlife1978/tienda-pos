<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas with squircle -->
  <rect width="512" height="512" rx="100" fill="url(#pwaGrad)" />

  <!-- Inner border ring -->
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Store Front & Shopping Cart Symbol -->
  <g filter="url(#shadow)" transform="translate(48, 48)">
    <!-- Store Canopy -->
    <path d="M 48 120 L 368 120 L 392 180 L 24 180 Z" fill="#ffffff" />
    <path d="M 24 180 Q 52 208 80 180 Q 108 208 136 180 Q 164 208 192 180 Q 220 208 248 180 Q 276 208 304 180 Q 332 208 360 180 Q 376 195 392 180" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Canopy Stripes in Emerald Accent -->
    <polygon points="80,120 136,120 120,180 64,180" fill="url(#accentGrad)" opacity="0.9" />
    <polygon points="192,120 248,120 232,180 176,180" fill="url(#accentGrad)" opacity="0.9" />
    <polygon points="304,120 360,120 344,180 288,180" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Store Pillars & Body -->
    <rect x="56" y="196" width="304" height="140" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="6" />

    <!-- POS Cart / Basket within Store -->
    <path d="M 120 236 L 148 236 L 176 300 L 268 300 L 292 252 L 156 252" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Wheels -->
    <circle cx="188" cy="324" r="14" fill="#38bdf8" />
    <circle cx="256" cy="324" r="14" fill="#38bdf8" />

    <!-- Dollar / Currency Symbol inside Cart -->
    <text x="216" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#10b981" text-anchor="middle">$</text>
  </g>

  <!-- Title Monogram "M&S" -->
  <text x="256" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">GRAN BODEGA</text>
  <text x="256" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="6" text-anchor="middle">POS & MAYORISTA</text>
</svg>
